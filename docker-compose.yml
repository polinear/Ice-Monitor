# ===================================================================
# Ice Monitor — полный стек для курсовой по большим данным
# Классы YOLO: slush_ice, open_water, broken_ice, vessel, ice_field, background
# ===================================================================

x-hadoop-env: &hadoop-env
  CORE_CONF_fs_defaultFS: hdfs://namenode:9000
  CORE_CONF_hadoop_http_staticuser_user: root
  CORE_CONF_hadoop_proxyuser_hue_hosts: "*"
  CORE_CONF_hadoop_proxyuser_hue_groups: "*"
  HDFS_CONF_dfs_webhdfs_enabled: "true"
  HDFS_CONF_dfs_permissions_enabled: "false"
  HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
  YARN_CONF_yarn_log___aggregation___enable: "true"
  YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
  YARN_CONF_yarn_timeline___service_enabled: "true"

x-hotpath-ingest-env: &hotpath-ingest-env
  REDIS_HOST: broker
  KAFKA_BOOTSTRAP: kafka:9092
  FPS: "10"
  FRAME_SIZE: "0"
  JPEG_QUALITY: "70"
  REDIS_MAXLEN: "100"
  CV_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

x-hotpath-worker-env: &hotpath-worker-env
  REDIS_HOST: broker
  KAFKA_BOOTSTRAP: kafka:9092
  SKIP_MODEL_INFERENCE: "0"
  INFER_SIZE: "224"
  MODEL_MAX_SIDE: "512"
  HEURISTIC_SIZE: "640"
  CONF_THRESH: "0.04"
  ENABLE_FALLBACK_MODEL: "0"
  RETINA_MASKS: "1"
  MAX_DET: "12"
  CV_THREADS: "1"
  TORCH_NUM_THREADS: "2"
  TORCH_INTEROP_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

services:

  # ================= HOT PATH (real-time) =====================

  broker:
    image: redis:7-alpine
    container_name: broker
    ports: ["6379:6379"]
    networks: [ice_net]

  ingest_a:
    build: ./ingest
    container_name: ingest_a
    environment:
      CAM_ID: "cam_a"
      SOURCE: "/data/cam_a.mp4"
      FRAME_SIZE: "0"
      <<: *hotpath-ingest-env
    volumes:
      - ./data:/data
    depends_on: [broker, kafka]
    networks: [ice_net]
    restart: on-failure

  ingest_b:
    build: ./ingest
    container_name: ingest_b
    environment:
      CAM_ID: "cam_b"
      SOURCE: "/data/cam_b.mp4"
      FRAME_SIZE: "0"
      <<: *hotpath-ingest-env
    volumes:
      - ./data:/data
    depends_on: [broker, kafka]
    networks: [ice_net]
    restart: on-failure

  worker_a:
    build: ./inference
    container_name: worker_a
    environment:
      CAM_ID: "cam_a"
      MODEL_PATH: "/weights/cam_a.pt"
      FALLBACK_MODEL_PATH: "/weights/cam_b.pt"
      MODEL_INPUT_FLIP_HORIZONTAL: "0"
      <<: *hotpath-worker-env
    volumes:
      - ./inference/weights:/weights
    depends_on: [broker, kafka]
    networks: [ice_net]
    restart: on-failure

  worker_b:
    build: ./inference
    container_name: worker_b
    environment:
      CAM_ID: "cam_b"
      MODEL_PATH: "/weights/cam_b.pt"
      <<: *hotpath-worker-env
    volumes:
      - ./inference/weights:/weights
    depends_on: [broker, kafka]
    networks: [ice_net]
    restart: on-failure

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: db
    environment:
      POSTGRES_PASSWORD: ice
      POSTGRES_DB: ice_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    networks: [ice_net]

  api:
    build: ./api
    container_name: api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: "postgresql://postgres:ice@db:5432/ice_monitor"
      REDIS_HOST: "broker"
    depends_on: [broker, db]
    networks: [ice_net]
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: frontend
    ports: ["8501:8501"]
    environment:
      API_HOST: "api"
    depends_on: [api]
    networks: [ice_net]

  # ================= KAFKA =====================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [ice_net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: [zookeeper]
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [ice_net]

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      set -e
      i=0
      until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
        i=$$((i+1))
        if [ $$i -ge 60 ]; then
          echo 'Kafka did not become ready in time'
          exit 1
        fi
        echo 'Waiting for Kafka broker...'
        sleep 2
      done
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ice.frames.cam_a --partitions 2 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ice.frames.cam_b --partitions 2 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ice.detections --partitions 4 --replication-factor 1
      echo 'Kafka topics created'
      "
    networks: [ice_net]

  # ================= HADOOP (HDFS + YARN) =====================

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      <<: *hadoop-env
      CLUSTER_NAME: ice_cluster
    ports: ["9870:9870", "9000:9000"]
    volumes:
      - hdfs_name:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9870' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [ice_net]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "namenode:9870"
    ports: ["9864:9864"]
    volumes:
      - hdfs_data:/hadoop/dfs/data
    depends_on: [namenode]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9864' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [ice_net]

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    ports: ["8088:8088"]
    depends_on: [namenode, datanode]
    networks: [ice_net]

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    depends_on: [resourcemanager]
    networks: [ice_net]

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-init
    environment:
      <<: *hadoop-env
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      set -e
      i=0
      until hdfs dfs -ls / >/dev/null 2>&1; do
        i=$$((i+1))
        if [ $$i -ge 60 ]; then
          echo 'HDFS did not become ready in time'
          exit 1
        fi
        echo 'Waiting for HDFS...'
        sleep 2
      done
      hdfs dfs -mkdir -p /raw/ice_detections
      hdfs dfs -mkdir -p /raw/frames
      hdfs dfs -mkdir -p /user/hive/warehouse
      hdfs dfs -mkdir -p /tmp
      hdfs dfs -chmod -R 777 /tmp /user/hive/warehouse /raw
      echo 'HDFS initialized'
      "
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    networks: [ice_net]

  # ================= HIVE =====================

  hive-metastore-db:
    image: postgres:15
    container_name: hive-metastore-db
    command: ["postgres", "-c", "password_encryption=md5"]
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    volumes:
      - hive_db:/var/lib/postgresql/data
    networks: [ice_net]

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 hive-metastore-db:5432"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://hive-metastore-db/metastore
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: hive
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: /user/hive/warehouse
    command: ["/bin/bash", "/opt/ice-monitor/scripts/start-hive-metastore.sh"]
    ports: ["9083:9083"]
    depends_on: [hive-metastore-db, namenode, datanode]
    volumes:
      - ./scripts:/opt/ice-monitor/scripts:ro
    networks: [ice_net]

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: "hive-metastore:9083"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://hive-metastore-db/metastore
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: hive
      HIVE_SITE_CONF_hive_metastore_uris: thrift://hive-metastore:9083
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: /user/hive/warehouse
      HIVE_SITE_CONF_hive_server2_enable_doAs: "false"
    ports: ["10000:10000", "10002:10002"]
    depends_on: [hive-metastore]
    volumes:
      - ./spark_jobs:/jobs
    networks: [ice_net]

  # ================= SPARK =====================

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    ports: ["8080:8080", "7077:7077"]
    environment:
      INIT_DAEMON_STEP: setup_spark
    volumes:
      - ./spark_jobs:/jobs
    networks: [ice_net]

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    depends_on: [spark-master]
    ports: ["8081:8081"]
    environment:
      SPARK_MASTER: "spark://spark-master:7077"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ./spark_jobs:/jobs
    networks: [ice_net]

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    depends_on: [spark-master]
    ports: ["8082:8081"]
    environment:
      SPARK_MASTER: "spark://spark-master:7077"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ./spark_jobs:/jobs
    networks: [ice_net]

  # ================= Kafka → HDFS sink (на Spark Structured Streaming) =====================

  kafka-to-hdfs:
    build: ./spark_jobs
    container_name: kafka-to-hdfs
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      HDFS_URI: "hdfs://namenode:9000"
      # Локальный режим — самый надёжный способ запуска Structured Streaming
      # в отдельном контейнере без сабмита в кластер Bitnami-workers.
      SPARK_MASTER: "local[*]"
      KAFKA_TOPIC: "ice.detections"
      STARTING_OFFSETS: "earliest"
      TRIGGER_SECONDS: "30"
    command: ["python", "-u", "/jobs/kafka_to_hdfs.py"]
    volumes:
      - ./spark_jobs:/jobs
      - spark_ivy:/root/.ivy2
    networks: [ice_net]
    restart: on-failure

  # ================= JUPYTER (для эксперимента по масштабируемости) =====================

  etl-runner:
    build: ./spark_jobs
    container_name: etl-runner
    depends_on:
      kafka-to-hdfs:
        condition: service_started
      spark-master:
        condition: service_started
      hive-metastore:
        condition: service_started
      hive-server:
        condition: service_started
      namenode:
        condition: service_started
    environment:
      HDFS_URI: "hdfs://namenode:9000"
      HIVE_METASTORE_URIS: "thrift://hive-metastore:9083"
      SPARK_MASTER: "local[*]"
      ETL_INTERVAL_SEC: "90"
      ETL_MASTER: "local[*]"
    command: ["python", "-u", "/jobs/etl_runner.py"]
    volumes:
      - ./spark_jobs:/jobs
    networks: [ice_net]
    restart: on-failure

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.3.0
    container_name: jupyter
    ports: ["8888:8888"]
    environment:
      JUPYTER_TOKEN: "ice"
      SPARK_OPTS: "--master=spark://spark-master:7077"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark_jobs:/home/jovyan/jobs
    depends_on: [spark-master]
    networks: [ice_net]

  # ================= SUPERSET (BI-дашборды на TimescaleDB) =====================

  superset:
    image: apache/superset:3.1.0
    container_name: superset
    ports: ["8089:8088"]
    environment:
      SUPERSET_SECRET_KEY: "icemonitorsecret2026"
      SUPERSET_BI_DB_NAME: "Ice Monitor Timescale"
      SUPERSET_BI_URI: "postgresql://postgres:ice@db:5432/ice_monitor"
    command: ["/bin/bash", "/opt/ice-monitor/scripts/start-superset.sh"]
    volumes:
      - superset_data:/app/superset_home
      - ./scripts:/opt/ice-monitor/scripts:ro
    depends_on: [db, api]
    restart: on-failure
    networks: [ice_net]

networks:
  ice_net:
    name: ice-monitor-net
    driver: bridge

volumes:
  pgdata:
  hdfs_name:
  hdfs_data:
  hive_db:
  superset_data:
  spark_ivy:
